name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build and test Vue
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm test

      - name: Start ASP.NET Core and PostgreSQL
        run: docker compose up -d app

      - name: Wait for API
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8180/ > /dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs app db
          exit 1

      - name: Build ASP.NET Core
        run: docker compose exec -T app dotnet build --no-restore

      - name: Test API, authentication and SignalR
        run: |
          node tests/openapi-smoke.mjs
          node tests/auth-smoke.mjs
          API_BASE_URL=http://localhost:8180 node frontend/tests/realtime-smoke.mjs
          if test -f frontend/tests/chat-smoke.mjs; then
            API_BASE_URL=http://localhost:8180 node frontend/tests/chat-smoke.mjs
          fi

      - name: Show logs on failure
        if: failure()
        run: docker compose logs app db

      - name: Stop test containers
        if: always()
        run: docker compose down -v
